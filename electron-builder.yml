appId: com.imgman.app
productName: IMGMAN
directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

# The window icon lives outside the asar so the main process can load it at runtime
# from process.resourcesPath (see src/main/index.ts). resources/ is the buildResources
# dir, not auto-bundled into the app, so copy the icon explicitly.
extraResources:
  - from: resources/icon.png
    to: icon.png

# better-sqlite3 and sharp are native modules: keep them unpacked from the asar
# so their .node binaries are loadable at runtime. install-app-deps (postinstall) /
# electron-rebuild build better-sqlite3 against Electron's ABI; sharp ships prebuilt
# platform binaries under @img/sharp-*.
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.graphics-design

linux:
  target:
    - AppImage
